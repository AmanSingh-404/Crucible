name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crucible
          POSTGRES_PASSWORD: crucible_dev
          POSTGRES_DB: crucible
        ports:
          - 5555:5432
        options: >-
          --health-cmd "pg_isready -U crucible"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://crucible:crucible_dev@localhost:5555/crucible

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run migrations
        run: uv run --package crucible-backend alembic -c backend/alembic.ini upgrade head

      - name: Tests (pytest)
        run: uv run pytest