[project]
name = "crucible-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aman Singh", email = "amanscode2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crucible-backend = "crucible_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
